spring.datasource.url=jdbc:mysql://localhost:3306/bookstore
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Razorpay configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Email OTP settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OTP throttling
otp.expiry-minutes=5
otp.resend-cooldown-seconds=60
otp.max-resend-count=5

# JWT settings
jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-characters}
jwt.expiration-minutes=60

# Admin configuration
admin.name=${ADMIN_NAME:Book Store Admin}
admin.email=${ADMIN_EMAIL:admin@bookstore.com}
admin.password=${ADMIN_PASSWORD:admin#123}

# Optional Firebase service account JSON path
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
